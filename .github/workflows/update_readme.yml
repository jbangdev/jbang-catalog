name: Update README
on:
  push:
    branches:
      - main
  workflow_dispatch:      
jobs:
  updateReadme:
    if: github.repository == 'jbangdev/jbang-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: jbangdev/setup-jbang@312c53a4221283f9c8e4aa84d8261b82f0c680fb # main

      - name: Update README
        run: |
          jbang catalog2readme@jbangdev -l ${{ github.repository }} > README.md
    
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "docs: Update README"
          title: Update README
          body: Update README with the latest list of aliases, templates and catalogs
          branch: update-readme
